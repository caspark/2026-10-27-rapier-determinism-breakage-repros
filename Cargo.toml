[package]
name = "rapier-determinism-repros"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rapier2d = { version = "=0.36.1", features = ["enhanced-determinism"] }
rapier3d = { version = "=0.36.1", features = ["enhanced-determinism"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "=44.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }

[features]
scheduling-repro = ["rapier2d/parallel"]

[[example]]
name = "missed_tear_2d"
required-features = ["scheduling-repro"]

[profile.release]
codegen-units = 1
